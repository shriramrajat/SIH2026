## image version: 22.4R1.10

version 22.4R1.10;

system {
    host-name LAB-SRX-01;
    domain-name lab.example.internal;
    time-zone UTC;

    services {
        ssh {
            root-login deny;
            protocol-version v2;
            max-sessions-per-connection 1;
        }
        netconf {
            ssh;
        }
    }

    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
    }

    ntp {
        server 192.0.2.1;
    }
}

interfaces {
    ge-0/0/0 {
        description "WAN uplink";
        unit 0 {
            family inet {
                address 203.0.113.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "LAN segment";
        unit 0 {
            family inet {
                address 10.1.0.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.100/32;
            }
        }
    }
}

routing-options {
    static {
        route 0.0.0.0/0 next-hop 203.0.113.1;
    }
    router-id 192.0.2.100;
    autonomous-system 65001;
}

security {
    zones {
        security-zone trust {
            interfaces {
                ge-0/0/1.0;
            }
        }
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
    }
}
